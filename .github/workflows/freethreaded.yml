name: Free-threaded Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  freethreaded-test:
    name: Free-threaded Python Tests
    runs-on: ubuntu-latest
    env:
      # Extension modules without free-threading support (e.g., pandas 2.x) re-enable the GIL on import
      PYTHON_GIL: "0"

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install free-threaded Python
      run: |
        uv python install 3.14t

    - name: Check free-threading detection
      run: |
        uv run --python 3.14t --isolated --with-editable . python -c "
        import sys
        from woeboost import WoeLearner
        print('Python version:', sys.version)
        assert not sys._is_gil_enabled(), 'GIL is enabled'
        assert WoeLearner().is_freethreaded, 'WoeLearner did not detect free-threading'
        print('Free-threading detected')
        "

    - name: Run tests
      run: |
        uv run --python 3.14t --isolated --with-editable . --with pytest --with faker \
          python -m pytest tests/unit tests/integration -v
