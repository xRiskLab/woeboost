name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # Publish an existing tag manually
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.2.0)"
        required: true

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Check tag matches package version
      run: |
        TAG="${{ github.event.release.tag_name || inputs.tag }}"
        VERSION=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        if [ "${TAG#v}" != "$VERSION" ]; then
          echo "Tag $TAG does not match pyproject.toml version $VERSION"
          exit 1
        fi

    - name: Build
      run: uv build

    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/woeboost/
    permissions:
      id-token: write  # Trusted publishing (OIDC), no API token needed

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - uses: pypa/gh-action-pypi-publish@release/v1
